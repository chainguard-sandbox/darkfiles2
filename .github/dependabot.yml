version: 2
updates:
  # Go module dependencies
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Brief cooldown so freshly-published (possibly compromised or broken)
    # releases have a little time to be caught and yanked before we bump.
    cooldown:
      default-days: 1
      semver-major-days: 3
      semver-minor-days: 2
      semver-patch-days: 1
      include:
        - "*"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Actions support only default-days (no per-semver cooldown).
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
