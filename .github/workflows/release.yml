name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: chainguard-actions/actions-checkout@42798c96a6a006223089d8b2908c0d8f592c2d6d # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: chainguard-actions/actions-setup-go@21d5c0a7417043fc34bd485b58aef80461398f1c # v6.5.0
        with:
          go-version-file: go.mod

      - name: Log in to ghcr.io
        uses: chainguard-actions/docker-login-action@59b6ec50c7e24ae938784029c60c019d02fdccdc # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: chainguard-actions/goreleaser-goreleaser-action@2fd58e2e43dd840f1bc9e8c1e02b611632f03bc4 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
